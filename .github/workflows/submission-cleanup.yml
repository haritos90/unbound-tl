name: Submission branch clean-up

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove:
    # Only branches the submission workflow wrote.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'submission/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch of the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The repository setting may have removed it.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          fi
