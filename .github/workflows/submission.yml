name: Editor submission

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # A run that only skips keeps its own group.
  group: >-
    submission-${{ github.event.issue.number }}-${{
    github.event.issue.state == 'open'
    && contains(github.event.issue.labels.*.name, 'submission')
    && (github.event.action != 'labeled' || (github.event.label.name == 'submission'
    && github.event.sender.login != github.event.issue.user.login))
    && (github.event.action != 'edited' || github.event.changes.body)
    && 'apply' || github.run_id }}
  cancel-in-progress: true

jobs:
  submit:
    # The form's own label also fires labeled.
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'submission')
      && (github.event.action != 'labeled' || (github.event.label.name == 'submission'
          && github.event.sender.login != github.event.issue.user.login))
      && (github.event.action != 'edited' || github.event.changes.body)
    runs-on: ubuntu-latest
    steps:
      # Credentials stay: the script pushes the branch.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMISSION_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/toolkit
      - name: Apply the submission and open the pull request
        env:
          GH_TOKEN: ${{ secrets.SUBMISSION_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/submission.sh

  remove:
    # Only branches this workflow wrote.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'submission/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the branch of the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The repository setting may have removed it.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          fi
