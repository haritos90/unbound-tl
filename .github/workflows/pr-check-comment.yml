name: Pull request check comment

on:
  workflow_run:
    workflows: ['Pull request checks']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    # The check job comments its own repository's pull requests.
    if: github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Default branch only: a fork's head is untrusted.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Find the check artifact
        id: artifact
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            return artifacts.some(artifact => artifact.name === 'pr-check');
      # Fork data stays outside the trusted checkout.
      - name: Download report and approximate previews
        if: steps.artifact.outputs.result == 'true'
        uses: actions/download-artifact@v7
        with:
          name: pr-check
          path: ${{ runner.temp }}/pr-check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create or update the check comment
        if: steps.artifact.outputs.result == 'true'
        env:
          PR_NUMBER_FILE: ${{ runner.temp }}/pr-check/pr-number.txt
          REPORT_FILE: ${{ runner.temp }}/pr-check/report.md
          RUN_ID: ${{ github.event.workflow_run.id }}
        uses: actions/github-script@v8
        with:
          script: |
            const comment = require('./.github/scripts/pr-check-comment.js');
            await comment({ github, context });
