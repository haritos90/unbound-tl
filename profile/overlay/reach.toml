[reach]
default_origin = "firered"
origin_regions = [
    {start = 0x170000, end = 0x1D0000, name = "firered-script"},
    {start = 0x740000, end = 0x2000000, name = "unbound"},
]

# Table starts set by hand:
# - pointers count to the base or one record before
# - the walk would merge a neighbouring structure
[[reach.table]]
name = "firered-dungeon-records"
base = 0x3F1B3C
stride = 12
count = 19
fields = [8]

# function table entries nothing calls
# - the code walk takes no root from them
[[reach.unused_entries]]
name = "specials 0x94 and 0x95"
base = 0x15FD60
indexes = [0x94, 0x95]

[[reach.observed]]
ids = ["s01A5FDF", "s01A6046"]
at = 0x1A8DD8
evidence = "Native battle defeat with lastHealingSpot=0 returns home and displays all eleven Mom paragraphs; loadpointer operands at 0x1A8DE7 and 0x1A8DF4. Static analysis misses the runtime recovery entry reached through 0x781443 and the pointer at 0x1FB432C."

[[reach.observed]]
ids = ["s1F821E0"]
at = 0x1EDBEB0

