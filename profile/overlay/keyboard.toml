[keyboard]
reserved = [0x1FFF000, 0x2000000]   # end exclusive; the text allocator never uses it
opening_keyboard_offsets = [0x09DEB0, 0x09DEA2]   # Immediate operands follow opening order.
page_count = [0x09E2A0, 0x09ED1E]   # the immediate byte of `movs r1,#3` (03 21)
labels = ["G23", "G21", "G22"]      # the page-swap label graphic of base page 0, 1, 2
# Semantic text slots bind pack rows to catalog entries.
[keyboard.row_bindings]
lower_keys_1 = "naming_keyboard:0"
lower_keys_2 = "naming_keyboard:1"
lower_keys_3 = "naming_keyboard:2"
lower_keys_4 = "naming_keyboard:3"
upper_keys_1 = "naming_keyboard:4"
upper_keys_2 = "naming_keyboard:5"
upper_keys_3 = "naming_keyboard:6"
upper_keys_4 = "naming_keyboard:7"
symbols_keys_1 = "naming_keyboard:8"
symbols_keys_2 = "naming_keyboard:9"
symbols_keys_3 = "naming_keyboard:10"
symbols_keys_4 = "naming_keyboard:11"
lower_display_1 = "s047A955"
lower_display_2 = "s047A976"
lower_display_3 = "s047A997"
lower_display_4 = "s047A9B8"
upper_display_1 = "s047A9D9"
upper_display_2 = "s047A9FA"
upper_display_3 = "s047AA1B"
upper_display_4 = "s047AA3C"
symbols_display_1 = "s047AA5D"
symbols_display_2 = "s047AA76"
symbols_display_3 = "s047AA8F"
symbols_display_4 = "s047AAA8"
# Union Room chat keyboard: three pages of ten row pointers.
# Each row holds five keys of text, typed as written.
# R swaps case through sCaseToggleTable, Latin letters only.
chat_upper_1 = "s047AAC1"
chat_upper_2 = "s047AAC7"
chat_upper_3 = "s047AACD"
chat_upper_4 = "s047AAD3"
chat_upper_5 = "s047AAD9"
chat_upper_6 = "s047AADF"
chat_upper_7 = "s047AAE5"
chat_upper_8 = "s047AAEB"
chat_upper_9 = "s047AAF1"
chat_upper_10 = "s047AAF7"
chat_lower_1 = "s047AAFD"
chat_lower_2 = "s047AB03"
chat_lower_3 = "s047AB09"
chat_lower_4 = "s047AB0F"
chat_lower_5 = "s047AB15"
chat_lower_6 = "s047AB1B"
chat_lower_7 = "s047AB21"
chat_lower_8 = "s047AB27"
chat_lower_9 = "s047AB2D"
chat_lower_10 = "s047AB33"
chat_symbols_1 = "s047AB41"
chat_symbols_2 = "s047AB4C"
