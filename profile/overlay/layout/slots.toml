[layout.placeholders]
# Placeholder fills measured at their widest value.
# - prefixed names: 83 px prefix plus 60 px species
# - trainer names and classes: widths of trainer_names

# Side prefixes: 'Ally' 82 px, opposing 59 px.
# Keypad icons {F8 xx} use the icon table widths.
# - the puzzle bar line shows whole in 120 px
"F8 00" = 8    # A
"F8 01" = 8    # B
"F8 02" = 16   # L
"F8 03" = 16   # R
"F8 04" = 24   # START
"F8 05" = 24   # SELECT
"F8 06" = 8    # D-pad up
"F8 07" = 8    # D-pad down
"F8 08" = 8    # D-pad left
"F8 09" = 8    # D-pad right
"F8 0A" = 8    # D-pad up and down
"F8 0B" = 8    # D-pad left and right
"F8 0C" = 8    # D-pad

# Name tables the script buffer commands copy from.
# A fill is measured at the entry the script names.
# Variable reads use the widest name of the table.
[layout.buffer_tables]
item = "items"
species = "species"
move = "moves"


[layout.fill_source.side-prefixes]
label = "Battle name prefix"
font = "font1"
value = { "max" = { "none" = { "empty" = true }, "opposing" = { "entries" = ["s0A4C61A"] }, "wild" = { "entries" = ["s0A4C636"] }, "shadow" = { "entries" = ["s0A4C640"] } } }
evidence = "BattleStringExpandPlaceholders reads the opposing, wild and shadow prefix literals before the battler nickname; the three catalog offsets identify those ROM strings."
mode = "advance"

[layout.fill_source.typed-nickname]
label = "Nickname of up to ten letters"
font = "font1"
value = { "letters" = 10, "alphabet" = "naming" }
evidence = "Battle nickname buffers hold ten letters and a terminator. Naming keyboard rows define typed letters; original naming rows cover imported names."
mode = "advance"

[layout.fill_source.typed-player]
label = "Player name of up to seven letters"
font = "font1"
value = { "letters" = 7, "alphabet" = "naming" }
evidence = "The save trainer name holds seven letters and a terminator; naming keyboard rows define the permitted typed letters."
mode = "advance"

[layout.fill_source.species]
label = "Species name"
font = "font1"
value = { "table" = "species" }
evidence = "The verified species name table binds every fixed field and followed long-name pointer in the ROM inventory."
mode = "advance"

[layout.fill_source.moves]
label = "Move name"
font = "font1"
value = { "table" = "moves" }
evidence = "The verified moves name table binds every fixed field and followed long-name pointer in the ROM inventory."
mode = "advance"

[layout.fill_source.abilities]
label = "Ability name"
font = "font1"
value = { "table" = "abilities" }
evidence = "The verified abilities name table binds every fixed field and followed long-name pointer in the ROM inventory."
mode = "advance"

[layout.fill_source.items]
label = "Item name"
font = "font1"
value = { "table" = "items" }
evidence = "The verified items name table binds every fixed field and followed long-name pointer in the ROM inventory."
mode = "advance"

[layout.fill_source.trainer_classes]
label = "Trainer class"
font = "font1"
value = { "table" = "trainer_classes" }
evidence = "The verified trainer_classes name table binds every fixed field and followed long-name pointer in the ROM inventory."
mode = "advance"

[layout.fill_source.nickname]
label = "Nickname or species name"
font = "font1"
value = { "max" = { "typed" = { "source" = "typed-nickname" }, "species" = { "source" = "species" } } }
evidence = "A battler name is a ten-letter nickname or the species name read from the species name table."
mode = "advance"

[layout.fill_source.prefixed-name]
label = "Battle name with prefix"
font = "font1"
value = { "concat" = [{ "source" = "side-prefixes" }, { "source" = "nickname" }] }
evidence = "BattleStringExpandPlaceholders concatenates the selected side prefix and the battler name without removing prefix spaces."
mode = "advance"

