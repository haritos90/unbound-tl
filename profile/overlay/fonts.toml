# Small font (FONT_SMALL): party names and compact UI.
# Glyphs are two stacked 8x8 tiles, widths after.
# Charset follows vanilla order.
[[font]]
name = "small"
glyphs = 0x1EAF00
widths = 0x1EEF00
style = "unbound-small"
evidence = "literal pools at 0x64C4 (0x081EAF00) and 0x64CC (0x081EEF00); charset order matches font0"

[font_style]
# Style key of the glyph art in assets/lang/<code>/fonts/<style>.txt
style = "unbound"
cell_height = 14

# Further styles: first cell row and row count.
[font_styles.unbound-small]
top = 1
rows = 12

# DexNav HUD draws text from a glyph sheet.
[[sprite_font]]
name = "dexnav-hud"
style = "unbound-outlined"
cell_rows = 8
sheet = 0xACAE6C
tiles = 95
pointers = [0x9D78F4]
order = "0123456789 ;?-./“”‘’…,♂♀ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
aliases = { ":" = " " }
fallback = 9
ink = 1
shadow = 12
background = 0
advance = 4   # 4 px per character; pack letters step their width
lookup = { guard = { offset = 0x9D7674, size = 12, sha256 = "909fb8dc8de5e0f75a5ec90f467f321cba3a1dde12aeb1b4ef83b557bd1f8871" }, code = "014b9b5c5b0105e0" }
shared = 1
advances = { " " = 2 }
routine = { code = "", words = ["table", "sheet", "advance", "tiles", "shadow", "step"] }
calls = [
  { guard = { offset = 0x9D7620, size = 8, sha256 = "4c7fc574caf9f21cdb5ffc984a112c1da3262395bb5de1d6bd1973bd2a065305" }, code = "004b1847", entry = 0 },
  { guard = { offset = 0x9D8C94, size = 16, sha256 = "709241def4572a004ca6f53a0e51caba522cf4261ae45e76fbab5bf6a6b283b2" }, code = "1218024b00f087f902e0c046", entry = 0x102 },
]
# Move and ability canvases of the HUD, 64 px each.
windows = [
  { table = "moves", width = 64, suffix = "/", where = "DexNav HUD move" },
  { table = "abilities", width = 64, where = "DexNav HUD ability" },
]
pair = { width = 111, where = "DexNav HUD move and ability before the eye icon", encounters = ["land", "water"], learnsets = ["level_up", "egg"] }

# Metric Pokédex printers replace imperial unit printers.
