note = "Pokedex entry text: record i is the entry of national dex i; every species the [pokedex.dex.map] maps onto that dex number shows this text, the forms included"
evidence = "the description pointer at +16 of the 36-byte dex records from 0x1A357CC ([pokedex.dex.records] holds the row evidence); record i is national dex i, [pokedex.dex.map] at 0x1A41FEA maps every species slot onto its dex number, and every pointer decodes as an entry text"

