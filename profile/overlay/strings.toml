[strings]
include = [
  # Alternate codec recognition is not implemented.
  0x459434, 0x459440,
  # Packed records lack an automatic field reader.
  0x1EF1906, 0x1EF190A, 0x1EF190D,
  # Literal reader lacks bounded function evidence.
  0x1F560BE,
]
# Raw binary allocations lack independent consumer boundaries.
exclude = [
  "s03ABDC8", "s0456638", "s04566A8", "s0464008",
  "s081EE44", "s081EFC8", "s081F2D0", "s0887280",
  "s0887700", "s0887B80", "s0888000", "s0887300",
  "s0FBEBDA", "s1000280", "s1035B08", "s1035DC8",
  # Object graphics +0x1C holds {image, 0x200} frame lists.
  # Infos 0xEBC188/0xEBC74C; images reader 0x5E90A.
  # Automatic frame consumers remain unimplemented.
  "s0EC1D84", "s0EC287C",
  # Layout 0x754934 reads four u16 border tiles.
  # Border pointer 0x75493C; real text starts 0x754900.
  # Automatic border consumers remain unimplemented.
  "s07548F8",
]

