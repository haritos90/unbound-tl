facts = ["Above var 3, it copies s0A4CAA9 «Чёрный клан » through StringCopy 0x8008D84 and appends the player's name from gSaveBlock2Ptr 0x300500C through StringAppend 0x8008DA4.", "Otherwise, it returns record 13 * 0x2D of trainer_classes, «Чёрный Эмбор» at 72 px, at 0x89BCEFC-0x89BCF2E.", "The s0A4C88B line «Команда: {B_TRAINER1_CLASS} {B_TRAINER1_NAME}» joins the class to the trainer's own name.", "In trainer_names, every class 0x2D trainer is named «Громила» at 42 px for 0xC3-0xC6 and 0xC9, or «Джеймс» at 36 px for 0xC7, 0x28A and 0x28B.", "The long form reaches 53 («Команда: ») + 113 + 6 + 42 = 214 px, and other classes reach 53 + 72 + 6 + 66 = 197 px, both within 222 px.", "A headless-emulator run of the built ROM uses var 0x5006 = 4, trainer 0xC9 and name «ШЩЖЮМЫФ».", "Its five hosts show «Чёрный клан ШЩЖЮМЫФ Громила», with the name 41 px right of its place at var 3."]
related_notes = ["note:3ecf8961-f306-5b81-9c81-2baf58cd43e2"]
status = "unreviewed"

