# Language policy; ROM facts remain in profile/.

text_prefixes = ["berry-number-prefix"]

[policy]
"version" = "3.0.0"
"profile" = "unbound-2.1.1.1"
"language" = "ru"
"rom_sha1" = "b4776b82a4c7915d0fadeaa27e013523f99dfd94"

[keyboard]
layout = "keyboard.toml"

# Pokédex height and weight in metres and kilograms
[code_replacements.pokedex-metric]
height_unit = "м"

[qa]
"optional_tokens" = ["{PK}", "{MN}"]
# Omit only explicitly permitted tokens.
"droppable" = ["mining-article", "japanese-s0459434", "japanese-s0459440", "chat-keyboard-keys", "repeated-player-name"]
"addable" = [{ capability = "start-menu-centering", ids = ["hash:66bedfe6", "hash:47007de3", "hash:6339a440", "hash:8c035d47", "hash:f6079fc9", "hash:70eb06ab", "hash:2c502e29", "hash:67ac47c7", "hash:edf91726"] }]

[qa.forbidden]
"\\.\\.\\." = { reason = "three dots: use the ellipsis character …", ru = "три точки: используйте символ многоточия …", needs_source = false }
"  " = { reason = "double space", ru = "двойной пробел", needs_source = false }
"(?:^|[^A-Za-z]|\\\\[nlp])BP(?![A-Za-z])" = { reason = "Battle Points: use the approved Russian label БО", ru = "Battle Points: используйте утверждённую русскую метку БО", needs_source = false }

