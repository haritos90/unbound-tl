"optional_tokens" = ["{PK}", "{MN}"]
# English article and Japanese glyph codes
"droppable" = ["mining-article", "japanese-s0459434", "japanese-s0459440"]
# Centred start-menu labels stay unselected
"addable" = []

[qa.forbidden]
"\\.\\.\\." = { reason = "three dots: use the ellipsis character …", fr = "trois points : utilisez le caractère de points de suspension …", needs_source = false }
"  " = { reason = "double space", fr = "double espace", needs_source = false }

